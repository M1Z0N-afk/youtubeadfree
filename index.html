<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad-Free YouTube Player</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    color: #fff;
  }

  .card {
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 1.25rem;
    padding: 2rem;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
    margin-bottom: 1.5rem;
    border-left: 5px solid #fff;
    padding-left: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  h1 span {
    background: #fff;
    color: #000;
    font-size: 0.7rem;
    padding: 0.25rem 0.75rem;
    border-radius: 40px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .input-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .input-group input {
    flex: 1 1 260px;
    background: #000;
    border: 1px solid #333;
    border-radius: 60px;
    padding: 0.9rem 1.5rem;
    font-size: Etc. 1rem;
    color: #fff;
    outline: none;
    transition: border-color 0.15s;
  }

  .input-group input::placeholder { color: #666; }
  .input-group input:focus { border-color: #fff; }

  .input-group button {
    background: #fff;
    border: none;
    padding: 0 2rem;
    border-radius: 60px;
    font-weight: 700;
    font-size: 1rem;
    color: #000;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    white-space: nowrap;
  }

  .input-group button:hover { background: #ddd; }
  .input-group button:active { transform: scale(0.97); }

  .player-wrapper {
    background: #000;
    border-radius: 0.75rem;
    overflow: hidden;
    border: 1px solid #2a2a2a;
    aspect-ratio: 16 / 9;
    width: 100%;
    position: relative;
  }

  .player-wrapper iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .player-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    flex-direction: column;
    gap: 0.6rem;
    color: #555;
    text-align: center;
    padding: 1.5rem;
    font-size: 1rem;
  }

  .player-placeholder svg {
    width: 44px;
    height: 44px;
    stroke: #555;
    opacity: 0.8;
  }

  .status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1rem;
    font-size: 0.8rem;
    color: #888;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  .badge {
    border: 1px solid #333;
    border-radius: 40px;
    padding: 0.3rem 0.8rem;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    color: #fff;
    font-weight: 600;
  }

  .clear-btn {
    background: transparent;
    border: 1px solid #333;
    color: #888;
    padding: 0.3rem  All 0.8rem;
    border-radius: 40px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .clear-btn:hover { color: #fff; border-color: #fff; }

  .error-msg {
    color: #fff;
    font-size: 0.8rem;
    margin-top: 0.75rem;
    padding: 0 0.5rem;
    min-height: 1.2rem;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Ad-Free Player <span>No Ads</span></h1>

    <div class="input-group">
      <input
        type="text"
        id="youtubeUrl"
        placeholder="Paste YouTube link or video ID"
        autocomplete="off"
        spellcheck="false"
        aria-label="YouTube URL"
      >
      <button id="playBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        Play
      </button>
    </div>

    <div class="player-wrapper" id="playerWrapper">
      <div class="player-placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="4" width="20" height="16" rx="3"/>
          <path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/>
        </svg>
        <span>Paste a YouTube URL and hit play</span>
      </div>
    </div>

    <div class="status">
      <div class="badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        Ad-free
      </div>
      <button class="clear-btn" id="clearBtn" type="button">Clear</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
  </div>

<script>
(function () {
  'use strict';

  const urlInput    = document.getElementById('youtubeUrl');
  const playBtn     = document.getElementById('playBtn');
  const playerWrap  = document.getElementById('playerWrapper');
  const errorMsg    = document.getElementById('errorMsg');
  const clearBtn    = document.getElementById('clearBtn');

  function extractVideoId(raw) {
    if (!raw) return null;
    const url = raw.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;

    const patterns = [
      /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
      /[?&]v=([a-zA-Z0-9_-]{11})/,
      /\/(?:embed|v|shorts)\/([a-zA-Z0-9_-]{11})/,
      /\/watch\/([a-zA-Z0-9_-]{11})/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  function loadVideo(videoId) {
    // Remove existing iframe
    const old = playerWrap.querySelector('iframe');
    if (old) old.remove();

    // Hide placeholder (don't remove – keeps layout sane if something fails)
    const ph = playerWrap.querySelector('.player-placeholder');
    if (ph) ph.style.display = 'none';

    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + videoId +
                 '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    iframe.allowFullscreen = true;
    iframe.title = 'Ad-free YouTube player';

    playerWrap.appendChild(iframe);
  }

  function handlePlay() {
    errorMsg.textContent = '';
    const url = urlInput.value.trim();

    if (!url) {
      errorMsg.textContent = 'Please paste a YouTube link first.';
      return;
    }

    const id = extractVideoId(url);
    if (!id) {
      errorMsg.textContent = 'That doesn\'t look like a valid YouTube URL.';
      return;
    }

    loadVideo(id);
  }

  function clearPlayer() {
    const old = playerWrap.querySelector('iframe');
    if (old) old.remove();

    const ph = playerWrap.querySelector('.player-placeholder');
    if (ph) ph.style.display = '';   // re-show placeholder

    urlInput.value = '';
    errorMsg.textContent = '';
    urlInput.focus();
  }

  // --- event wiring ---
  playBtn.addEventListener('click', handlePlay);

  urlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      handlePlay();
    }
  });

  clearBtn.addEventListener('click', clearPlayer);
})();
</script>
</body>
</html>
